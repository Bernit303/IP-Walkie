<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>LAN Walkie</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="setup" class="screen">
  <h1>LAN Walkie</h1>
  <p>Pick a name so others know who's talking.</p>
  <input id="name-input" type="text" placeholder="Your name" maxlength="24" autocomplete="off" />
  <button id="join-btn">Join channel</button>
</div>

<div id="talk" class="screen hidden">
  <div id="status">Connecting…</div>
  <button id="ptt">HOLD TO TALK</button>
  <p class="hint">Hold the button (or hold Space) to talk. Release to listen.</p>
  <p class="hint you-line">You're <strong id="my-name-label"></strong> — <a href="#" id="change-name">not you?</a></p>
  <h2>On the channel</h2>
  <ul id="peer-list"><li class="empty">No one else here yet</li></ul>
</div>

<script src="app.js"></script>
</body>
</html>
