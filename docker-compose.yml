services:
  lan-walkie:
    build: .
    image: lan-walkie:latest
    container_name: lan-walkie
    restart: unless-stopped
    ports:
      # BIND_ADDR defaults to every interface. Set it to the LAN IP, or to
      # 127.0.0.1 if everything goes through Tailscale Serve on this host.
      - "${BIND_ADDR:-0.0.0.0}:8443:8443"
    volumes:
      - lan-walkie-certs:/app/certs
    environment:
      - PORT=8443
      # Uncomment and set these for Docker deployments — the container can't
      # see the host's real LAN IP/hostname to put in its cert automatically.
      # - CERT_HOSTNAMES=your-hostname
      # - CERT_IPS=192.168.1.100
      # - MAX_TRANSMIT_MS=60000
      # - MAX_CLIENTS=32
      # Generate with: openssl rand -hex 24  (16+ chars; placeholders are refused)
      # - PRIORITY_TOKEN=
      # Comma-separated browser origins allowed to open the WebSocket.
      # - ALLOWED_ORIGINS=https://your-host.your-tailnet.ts.net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m

volumes:
  lan-walkie-certs:
